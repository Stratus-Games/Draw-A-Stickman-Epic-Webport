<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Draw a Stickman: EPIC</title>
<style>

  html, body { margin: 0; height: 100%; background: #07090c; color: #d6dfeb; overflow: hidden;
    font: 13px/1.5 ui-sans-serif, "Segoe UI", system-ui, sans-serif; }
  #app { height: 100%; display: flex; flex-direction: column; min-height: 0; }
  #shell { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; height: 100%; }
  #main { flex: 1 1 0; display: flex; min-height: 0; min-width: 0; }
  #stage { flex: 1 1 0; min-width: 0; min-height: 0; display: flex; align-items: center;
    justify-content: center; background: #000; overflow: hidden; position: relative; }
  #theCanvas { background: #000; display: block; touch-action: none; outline: none;
    cursor: crosshair; flex: 0 0 auto; }
  /* a release is the game only: no studio bar, no raw console panel */
  #bar, #logpanel { display: none !important; }


  #redecSplash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; background: #07090c; color: #e7eef7;
    transition: opacity .7s ease; }
  #redecSplash .tag { font: 500 12px/1 ui-sans-serif, "Segoe UI", system-ui, sans-serif;
    color: #6d7f95; letter-spacing: .22em; text-transform: uppercase; }
  #redecSplash .bar { width: 264px; max-width: 70vw; height: 4px; background: #18202b;
    border-radius: 999px; overflow: hidden; }
  #redecSplash .bar i { display: block; height: 100%; width: 0; border-radius: 999px;
    background: linear-gradient(90deg, #e4912a, #f7c15a); transition: width .28s ease; }
  #redecSplash .pct { font: 11px/1 ui-monospace, ui-sans-serif, system-ui, sans-serif;
    color: #7d90a8; letter-spacing: .14em; font-variant-numeric: tabular-nums; }
  #redecSplash .sub { font-size: 12px; color: #55677c; }
  #redecSplash.gone { opacity: 0; pointer-events: none; }
  #redecSplash.bad .sub { color: #e0776d; }
  #redecSplash.bad .bar i { background: #e0776d; width: 100% !important; }

</style>
</head>
<body>

<div id="redecSplash">
  <div class="tag">Draw a Stickman: EPIC</div>
  <div class="bar"><i id="redecBarFill"></i></div>
  <div class="pct" id="redecPct">0%</div>
  <div class="sub" id="redecSplashSub">loading…</div>
</div>
<div id="app"></div>

<script>window.__REDEC_RELEASE__ = { title: "Draw a Stickman: EPIC" };</script>
<script>/* Redec release loader.
 *
 * Reads game.redec (a gzip'd container: header + JSON manifest + file bytes),
 * serves every archived path from memory for both fetch() and XMLHttpRequest,
 * mounts the .NET runtime modules (dotnet.js / dotnet.native.js /
 * dotnet.runtime.js) from the archive as blob modules, then boots Blazor.
 *
 * index.html is generated by the packer and inlines this file, with
 * window.__REDEC_RELEASE__ = { splash, title } set just before it.
 */
(function () {
  'use strict';

  var cfg = window.__REDEC_RELEASE__ || {};
  var MAGIC = 'REDEC1\n';
  var base = new URL('.', location.href).href;
  var basePath = new URL(base).pathname;
  var files = new Map();
  var blobs = new Map();
  var engine = null;
  var splash = document.getElementById('redecSplash');
  var splashSub = document.getElementById('redecSplashSub');
  var barFill = document.getElementById('redecBarFill');
  var pctEl = document.getElementById('redecPct');
  var booted = false;
  var traceOn = /(^|[?&])trace\b/.test(location.search);
  var traceLeft = 80;

  function trace(msg, key) {
    if (!traceOn || traceLeft-- <= 0) return;
    if (key && /^_framework\/.*\.dll$/.test(key)) return; // assembly loads are noise
    console.log('[redec] ' + msg);
  }

  function fail(msg) {
    if (splashSub) splashSub.textContent = 'failed: ' + msg;
    if (splash) splash.classList.add('bad');
    console.error('[redec] ' + msg);
  }

  function progress(pct, label) {
    if (barFill) barFill.style.width = pct + '%';
    if (pctEl) pctEl.textContent = Math.round(pct) + '%';
    if (label && splashSub) splashSub.textContent = label;
  }

  function keyOf(url) {
    try {
      var u = new URL(String(url), location.href);
      if (u.origin !== location.origin) return null;
      var p = decodeURIComponent(u.pathname);
      if (p.indexOf(basePath) !== 0) return null;
      return p.slice(basePath.length);
    } catch (e) {
      return null;
    }
  }

  // Blazor's loader resolves its boot config and runtime modules against the
  // document (the inline loader has no script URL), so those names arrive at
  // the release root; keep the real copies under _framework/.
  function alias(key) {
    if (key === 'blazor.boot.json' || key === 'dotnet.js' ||
        key === 'dotnet.native.js' || key === 'dotnet.runtime.js') {
      return '_framework/' + key;
    }
    return key;
  }

  function pick(key) {
    key = alias(key);
    if (!key) return null;
    if (files.has(key)) return key;
    var m = /\.(br|gz)$/.exec(key);
    if (m) {
      var raw = key.slice(0, -m[0].length);
      if (files.has(raw)) return raw;
    }
    return null;
  }

  function mimeOf(key) {
    var ext = (key.split('.').pop() || '').toLowerCase();
    if (ext === 'wasm') return 'application/wasm';
    if (ext === 'js' || ext === 'mjs') return 'text/javascript';
    if (ext === 'json') return 'application/json';
    if (ext === 'html' || ext === 'htm') return 'text/html';
    if (ext === 'css') return 'text/css';
    if (ext === 'png') return 'image/png';
    if (ext === 'jpg' || ext === 'jpeg') return 'image/jpeg';
    if (ext === 'gif') return 'image/gif';
    if (ext === 'svg') return 'image/svg+xml';
    if (ext === 'ogg') return 'audio/ogg';
    if (ext === 'mp3') return 'audio/mpeg';
    if (ext === 'wav') return 'audio/wav';
    if (ext === 'dat') return 'application/octet-stream';
    return 'application/octet-stream';
  }

  function bodyFor(key) {
    var f = pick(key);
    if (!f) return null;
    if (/blazor\.boot\.json$/.test(f)) return rewriteBootJson(files.get(f));
    return files.get(f);
  }

  function rewriteBootJson(bytes) {
    try {
      var json = JSON.parse(new TextDecoder().decode(bytes));
      var res = json.resources || {};
      ['jsModuleNative', 'jsModuleRuntime'].forEach(function (slot) {
        var map = res[slot];
        if (!map) return;
        Object.keys(map).forEach(function (name) {
          var url = moduleUrl('_framework/' + name);
          if (!url) return;
          map[url] = map[name];
          delete map[name];
        });
      });
      return new TextEncoder().encode(JSON.stringify(json));
    } catch (e) {
      return bytes;
    }
  }

  function respond(bytes, type) {
    return new Response(bytes, {
      status: 200,
      headers: {
        'Content-Type': type,
        'Content-Length': String(bytes.byteLength || bytes.length || 0)
      }
    });
  }

  // --- fetch -------------------------------------------------------------
  var nativeFetch = window.fetch ? window.fetch.bind(window) : null;
  window.fetch = function (input, init) {
    var url = typeof input === 'string' ? input : (input && input.url) || String(input);
    var key = keyOf(url);
    var body = bodyFor(key);
    trace('fetch ' + (body ? 'hit ' : 'MISS ') + String(key || url).slice(0, 120), key);
    if (body) return Promise.resolve(respond(body, mimeOf(pick(key) || key)));
    if (key && /dotnet\.native\.wasm$/.test(key) && engine) {
      return Promise.resolve(respond(engine, 'application/wasm'));
    }
    if (nativeFetch) return nativeFetch(input, init);
    return Promise.reject(new Error('no fetch for ' + url));
  };

  // --- XMLHttpRequest ----------------------------------------------------
  // The nkast interop layer (content loading) creates real XHR objects.
  function RedeXHR() {
    this.readyState = 0;
    this.status = 0;
    this.statusText = '';
    this.response = null;
    this.responseText = '';
    this.responseType = '';
    this.responseURL = '';
    this.onreadystatechange = null;
    this.onload = null;
    this.onerror = null;
    this.onabort = null;
    this.ontimeout = null;
    this.onloadend = null;
    this.withCredentials = false;
    this.timeout = 0;
    this._headers = {};
  }
  RedeXHR.prototype.open = function (method, url, async) {
    this._method = String(method || 'GET').toUpperCase();
    this._url = url;
    this._async = async !== false;
    this.readyState = 1;
    this._fire('readystatechange');
  };
  RedeXHR.prototype.setRequestHeader = function (name, value) {
    this._headers[name] = value;
  };
  RedeXHR.prototype.getResponseHeader = function (name) {
    return this._respHeaders ? this._respHeaders[String(name).toLowerCase()] || null : null;
  };
  RedeXHR.prototype.getAllResponseHeaders = function () {
    return '';
  };
  RedeXHR.prototype.overrideMimeType = function () {};
  RedeXHR.prototype.abort = function () {
    this._aborted = true;
    this._fire('abort');
    this._fire('loadend');
  };
  RedeXHR.prototype._fire = function (name) {
    var fn = this['on' + name];
    if (typeof fn === 'function') {
      try { fn.call(this, { type: name, target: this }); } catch (e) { console.error(e); }
    }
    var ev = this['on' + name];
    void ev;
  };
  // Bytes -> string the way XHR does it without a responseType: one char per
  // byte. The content reader uses overrideMimeType('…x-user-defined') and then
  // rebuilds bytes from char codes, so UTF-8 decoding would corrupt every .xnb.
  function latin1(bytes) {
    var out = '';
    for (var i = 0; i < bytes.length; i += 8192) {
      out += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
    }
    return out;
  }

  RedeXHR.prototype._complete = function (body, key) {
    var type = mimeOf(pick(key) || key || '');
    this.status = body ? 200 : 404;
    this.statusText = body ? 'OK' : 'Not Found';
    this.responseURL = new URL(this._url, location.href).href;
    this._respHeaders = { 'content-type': type };
    if (body) {
      if (this.responseType === 'arraybuffer') {
        this.response = body.buffer.slice(body.byteOffset, body.byteOffset + body.byteLength);
      } else if (this.responseType === 'blob') {
        this.response = new Blob([body], { type: type });
      } else if (this.responseType === 'json') {
        try { this.response = JSON.parse(new TextDecoder().decode(body)); } catch (e) { this.response = null; }
      } else {
        this.responseText = latin1(body);
        this.response = this.responseText;
      }
    }
    this.readyState = 4;
    this._fire('readystatechange');
    this._fire(body ? 'load' : 'error');
    this._fire('loadend');
  };

  RedeXHR.prototype.send = function () {
    var self = this;
    if (!this._async) {
      // Content loading is synchronous: status is read as soon as send() returns.
      if (this._aborted) return;
      var key = keyOf(this._url);
      var body = bodyFor(key);
      trace('xhr(sync) ' + (body ? 'hit ' : 'MISS ') + String(key || this._url).slice(0, 120), key);
      if (!body && key && /dotnet\.native\.wasm$/.test(key)) body = engine;
      this._complete(body, key);
      return;
    }
    setTimeout(function () {
      if (self._aborted) return;
      var key = keyOf(self._url);
      var body = bodyFor(key);
      trace('xhr ' + (body ? 'hit ' : 'MISS ') + String(key || self._url).slice(0, 120) + ' type=' + self.responseType, key);
      if (!body && key && /dotnet\.native\.wasm$/.test(key)) body = engine;
      self._complete(body, key);
    }, 0);
  };
  window.XMLHttpRequest = RedeXHR;

  // --- module mounting ---------------------------------------------------
  function moduleUrl(path) {
    if (blobs.has(path)) return blobs.get(path);
    if (!files.has(path)) return null;
    var text = new TextDecoder().decode(files.get(path));
    // import.meta.url is the runtime's script directory: it resolves assembly
    // names and icudt.dat against it. Both live under _framework/ in the
    // archive, and dotnet.native.wasm is answered by our fetch shim.
    text = text.split('import.meta.url').join(JSON.stringify(base + '_framework/'));
    var url = URL.createObjectURL(new Blob([text], { type: 'text/javascript' }));
    blobs.set(path, url);
    return url;
  }

  window.__REDEC_MODULE = function (url) {
    var key = keyOf(url);
    if (key) {
      if (/dotnet\.native\.js$/.test(key)) return moduleUrl('_framework/dotnet.native.js') || url;
      if (/dotnet\.runtime\.js$/.test(key)) return moduleUrl('_framework/dotnet.runtime.js') || url;
      if (/dotnet\.js$/.test(key)) return moduleUrl('_framework/dotnet.js') || url;
    }
    return url;
  };

  // --- scripts -----------------------------------------------------------
  function runScript(path) {
    var data = files.get(path);
    if (!data) throw new Error('missing script ' + path);
    var s = document.createElement('script');
    s.text = new TextDecoder().decode(data);
    if (/blazor\.webassembly\.js$/.test(path)) {
      // route every dynamic module import through the archive
      s.text = s.text.replace(/await import\(([A-Za-z_$][\w$]*)\)/g,
        'await import(window.__REDEC_MODULE($1))');
      s.setAttribute('autostart', 'false');
    }
    document.head.appendChild(s);
  }

  // --- splash ------------------------------------------------------------
  function ready() {
    if (booted) return;
    booted = true;
    progress(100, 'ready');
    if (!splash) return;
    setTimeout(function () {
      splash.classList.add('gone');
      setTimeout(function () { splash.remove(); }, 900);
    }, 900);
  }

  function watch() {
    var timer = setInterval(function () {
      if (window.__redecShellReady) {
        clearInterval(timer);
        ready();
      }
    }, 200);
    // Never leave the loading screen up if the game never reports in.
    setTimeout(function () { clearInterval(timer); ready(); }, 90000);
  }

  // --- archive ------------------------------------------------------------
  // The data is either one game.redec or game.redec.part1..N pieces: fetch the
  // parts in order, concatenate, then gunzip the joined stream.
  async function loadArchive() {
    var whole = await (nativeFetch || fetch)('game.redec', { cache: 'no-store' });
    if (whole.ok) return { bytes: new Uint8Array(await whole.arrayBuffer()), parts: 1 };
    var chunks = [], total = 0;
    for (var i = 1; i <= 512; i++) {
      var r = await (nativeFetch || fetch)('game.redec.part' + i, { cache: 'no-store' });
      if (!r.ok) break;
      var b = new Uint8Array(await r.arrayBuffer());
      if (!b.byteLength) break;
      chunks.push(b);
      total += b.byteLength;
      progress(4 + Math.min(6, i), 'loading game.redec.part' + i + '…');
    }
    if (!chunks.length) throw new Error('game.redec not found (no .part files either)');
    var out = new Uint8Array(total), at = 0;
    for (var c = 0; c < chunks.length; c++) {
      out.set(chunks[c], at);
      at += chunks[c].byteLength;
    }
    return { bytes: out, parts: chunks.length };
  }

  // --- boot --------------------------------------------------------------
  (async function boot() {
    try {
      progress(4, 'loading game.redec…');
      var archive = await loadArchive();
      progress(12, archive.parts > 1 ? 'merging ' + archive.parts + ' parts…' : 'unpacking game data…');
      var stream = new Blob([archive.bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      var raw = await new Response(stream).arrayBuffer();
      var bytes = new Uint8Array(raw);
      var dec = new TextDecoder();
      if (dec.decode(bytes.subarray(0, MAGIC.length)) !== MAGIC) {
        throw new Error('not a .redec container');
      }
      var view = new DataView(raw);
      var manifestLen = view.getUint32(MAGIC.length, true);
      var manifest = JSON.parse(dec.decode(bytes.subarray(MAGIC.length + 4, MAGIC.length + 4 + manifestLen)));
      var dataStart = MAGIC.length + 4 + manifestLen;
      (manifest.files || []).forEach(function (f) {
        files.set(f.p, bytes.subarray(dataStart + f.o, dataStart + f.o + f.s));
      });
      progress(45, 'loading engine…');
      var wasm = await (nativeFetch || fetch)('redec.wasm', { cache: 'no-store' });
      if (!wasm.ok) throw new Error('redec.wasm: HTTP ' + wasm.status);
      engine = new Uint8Array(await wasm.arrayBuffer());
      progress(60, 'starting engine…');

      var scripts = manifest.scripts && manifest.scripts.length ? manifest.scripts : [
        '_framework/blazor.webassembly.js'
      ];
      for (var i = 0; i < scripts.length; i++) {
        var key = scripts[i];
        if (!pick(key)) continue;
        if (/blazor\.webassembly\.js$/.test(key)) continue;
        runScript(pick(key));
      }
      var blazor = scripts.filter(function (s) { return /blazor\.webassembly\.js$/.test(s); })[0] ||
        '_framework/blazor.webassembly.js';
      if (!pick(blazor)) throw new Error('missing blazor.webassembly.js');
      runScript(pick(blazor));
      progress(72, 'starting game…');
      if (window.Blazor && Blazor.start) {
        await Blazor.start();
      }
      progress(85, 'starting game…');
      // App.razor sets window.__redecShellReady once the game loop is running.
      watch();
    } catch (e) {
      fail(e && e.message ? e.message : String(e));
    }
  })();
})();
</script>
</body>
</html>
